<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2050" />
      <stop offset="60%" stop-color="#151025" />
      <stop offset="100%" stop-color="#0A0712" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#6B5004" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  
  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Four Cardinal Stars -->
  <polygon points="256,66 261,84 279,84 264,95 270,113 256,102 242,113 248,95 233,84 251,84" fill="#D4AF37"/>
  <polygon points="256,446 261,428 279,428 264,417 270,399 256,410 242,399 248,417 233,428 251,428" fill="#D4AF37"/>
  <polygon points="66,256 84,261 84,279 95,264 113,270 102,256 113,242 95,248 84,233 84,251" fill="#D4AF37"/>
  <polygon points="446,256 428,261 428,279 417,264 399,270 410,256 399,242 417,248 428,233 428,251" fill="#D4AF37"/>

  <!-- Central Emblem: Crescent Moon embracing Jupiter ♃ -->
  <g filter="url(#glow)">
    <!-- Crescent Moon -->
    <path d="M 230 140 A 120 120 0 1 0 350 310 A 140 140 0 0 1 230 140 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Jupiter Symbol (♃) Stylized in Sacred Gold -->
    <!-- Crossbar and stem -->
    <path d="M 270,195 L 320,195 M 295,175 L 295,335 M 240,240 C 220,215 250,190 280,195" 
          fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 270,195 L 320,195 M 295,175 L 295,335 M 240,240 C 220,215 250,190 280,195" 
          fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mystical Text Arc or Accent -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 9" opacity="0.7"/>
</svg>
